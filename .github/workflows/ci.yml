name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - coverage-summary.json
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: cd packages/sdk && pnpm run typecheck

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Generate coverage report
        if: matrix.node-version == 24
        run: cd packages/sdk && pnpm exec vitest run --coverage --coverage.reporter=text --coverage.reporter=lcov --coverage.reporter=html --coverage.reporter=json-summary
        continue-on-error: true

      - name: Update coverage summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == 24
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')

            const branch = context.ref.replace('refs/heads/', '')
            const targetPath = 'coverage-summary.json'
            const summaryPath = path.join(
              process.env.GITHUB_WORKSPACE,
              'packages/sdk/coverage/coverage-summary.json',
            )
            const content = `${fs.readFileSync(summaryPath, 'utf8').trim()}\n`
            const encoded = Buffer.from(content).toString('base64')

            let sha
            let existingContent

            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: targetPath,
                ref: branch,
              })

              if (Array.isArray(data)) {
                throw new Error(`${targetPath} is a directory, expected a file`)
              }

              sha = data.sha
              existingContent = Buffer.from(data.content, 'base64').toString('utf8')
            } catch (error) {
              if (error.status !== 404) throw error
            }

            if (existingContent === content) {
              core.info('Coverage summary is already up to date.')
              return
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: targetPath,
              message: 'chore: update coverage summary',
              content: encoded,
              sha,
              branch,
            })

      - name: Comment coverage summary
        if: github.event_name == 'pull_request' && matrix.node-version == 24
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')

            const marker = '<!-- tenantscale-coverage-summary -->'
            const summaryPath = path.join(
              process.env.GITHUB_WORKSPACE,
              'packages/sdk/coverage/coverage-summary.json',
            )
            const { total } = JSON.parse(fs.readFileSync(summaryPath, 'utf8'))
            const metrics = [
              ['Statements', total.statements],
              ['Branches', total.branches],
              ['Functions', total.functions],
              ['Lines', total.lines],
            ]
            const formatPct = (value) => `${Number(value).toFixed(2)}%`
            const rows = metrics
              .map(
                ([label, metric]) =>
                  `| ${label} | ${formatPct(metric.pct)} | ${metric.covered}/${metric.total} |`,
              )
              .join('\n')
            const body = [
              marker,
              '## Coverage Summary',
              '',
              '| Metric | Coverage | Covered / Total |',
              '| --- | ---: | ---: |',
              rows,
              '',
              '_Generated from the `packages/sdk` Vitest coverage report._',
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })

            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
